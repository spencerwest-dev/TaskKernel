server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

clerk.secret.key=${CLERK_SECRET_KEY}
clerk.publishable.key=${CLERK_PUBLISHABLE_KEY}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CLERK_JWKS_URI}
clerk.issuer=${CLERK_ISSUER:}
clerk.authorized-party=${CLERK_AUTHORIZED_PARTY:}
clerk.audience=${CLERK_AUDIENCE:}

# Section 2 — CWE-306 (Janeth Loera): completion endpoint rate limit (per JWT subject / minute)
cwe306.completion.rate-limit.enabled=true
cwe306.completion.rate-limit.per-minute=90
