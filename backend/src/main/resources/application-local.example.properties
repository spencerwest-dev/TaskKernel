server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/taskkernel
spring.datasource.username=taskkernel_user
spring.datasource.password=change-me
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://your-clerk-domain.clerk.accounts.dev/.well-known/jwks.json
clerk.issuer=https://your-clerk-domain.clerk.accounts.dev
clerk.authorized-party=http://localhost:3000
clerk.audience=
